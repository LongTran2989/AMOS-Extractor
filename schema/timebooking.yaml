entity: timebooking
description: Time bookings for work steps
root: time_captured
tables:
  time_captured:
    role: root
    primary_key: [bookingno_i]
    joins:
      - { from: time_captured.bookingno_i, to: time_captured_additional.bookingno_i, type: left, cardinality: "1:1", trust: probed }
  time_captured_additional:
    role: link
    primary_key: [bookingno_i]
    joins:
      - { from: time_captured_additional.itemno_i, to: wo_text_action.actionno_i, type: left, cardinality: "N:1", trust: probed }
fields:
  - column: time_captured.bookingno_i
    name_status: unnamed
    trust: documented
  - column: time_captured.user_sign
    name_status: unnamed
    trust: documented
  - column: time_captured.created_by
    name_status: unnamed
    trust: documented
  - column: time_captured.start_date
    name_status: unnamed
    trust: documented
  - column: time_captured.start_time
    name_status: unnamed
    trust: documented
  - column: time_captured.end_date
    name_status: unnamed
    trust: documented
  - column: time_captured.end_time
    name_status: unnamed
    trust: documented
  - column: time_captured.duration
    name_status: unnamed
    trust: documented
  - column: time_captured.primkey
    name_status: unnamed
    trust: documented
  - column: time_captured_additional.itemno_i
    name_status: unnamed
    trust: documented
