entity: wp_item
description: Workpack item (a WO assigned to a WP). Membership comes from wp_assignment; wp_sequence only adds the item numbering and may be missing.
root: wp_sequence
tables:
  wp_assignment:
    role: link
    meaning: "Authoritative list of WOs assigned to a WP. Probed on WP 'A898-210926 LINE-MCC': returns items that have NO wp_sequence row (wp_sequence returned zero rows for that WP). Extractions must start from here and LEFT JOIN wp_sequence."
    primary_key: [wp_assignmentno_i]
    joins:
      - { from: wp_header.wpno_i, to: wp_assignment.wpno_i, type: left, cardinality: "1:N", trust: probed }
      - { from: wp_assignment.event_perfno_i, to: wo_header.event_perfno_i, type: left, cardinality: "N:1", trust: probed }
      - { from: wp_assignment.wpno_i, to: wp_sequence.wpno_i, type: left, cardinality: "1:1", trust: probed, note: "Composite join: ALSO require wp_sequence.event_perfno_i = wp_assignment.event_perfno_i. wp_sequence may have no row (unsequenced item); wp_sequence.status 9 = WO deassigned" }
  wp_sequence:
    role: root
    primary_key: [wp_sequence_id]
    joins:
      - { from: wp_sequence.wpno_i, to: wp_header.wpno_i, type: left, cardinality: "N:1", trust: probed }
      - { from: wp_sequence.event_perfno_i, to: wo_header.event_perfno_i, type: left, cardinality: "1:1", trust: probed }
fields:
  - column: wp_sequence.wp_sequence_id
    name_status: unnamed
    trust: documented
  - column: wp_sequence.seqno_prefix_i
    name_status: approved
    name: wp_seq_1st
    trust: probed
  - column: wp_sequence.seqno
    name_status: approved
    name: wp_seq_2nd
    trust: probed
  - column: wp_sequence.seqno_prefix_i2
    name_status: unnamed
    trust: documented
  - column: wp_sequence.seqno_prefix
    name_status: unnamed
    trust: documented
  - column: wp_sequence.seqno2
    name_status: unnamed
    trust: documented
