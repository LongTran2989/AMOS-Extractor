entity: part_request
description: Part requests (materials) for maintenance events (e.g. Worksteps)
root: part_request_2
tables:
  part_request_2:
    role: root
    primary_key: [part_requestno_i]
    joins:
      - { from: part_request_2.event_key, to: workstep_link.workstep_linkno_i, type: left, cardinality: "N:1", trust: probed, note: "Requires part_request_2.event_type = 'WSL' for Workstep level linkage" }
      - { from: part_request_2.partno, to: part.partno, type: left, cardinality: "N:1", trust: probed, note: "Tool classification. part.partno is unique (192,627 rows = 192,627 distinct partno, probed 2026-11-18), so the join does not multiply rows. Probed on WSL part requests: 14,109,629 matched; 31,131 have no part row. part_request_2 has no tool column in the DWH (tool_flag exists in AMOS only)." }
  part:
    role: lookup
    meaning: Part definition. Holds the tool flag and material class of a part number.
    primary_key: [partno]
    joins:
      - { from: part.partno, to: part_request_2.partno, type: left, cardinality: "1:N", trust: probed, note: "Inverse of part_request_2.partno -> part.partno." }
fields:
  - column: part_request_2.part_requestno_i
    name_status: approved
    name: part_requestno_i
    trust: documented
    note: "Primary key of the part request. Join key from a workstep part request to pickslips, bookings, receiving and stock history (see pickslip.yaml). Approved by the user 2026-11-18."
  - column: part_request_2.partno
    name_status: approved
    name: part_no
    trust: probed
    note: "The PN required to perform the sequence (down to the workstep level)"
  - column: part_request_2.qty
    name_status: approved
    name: part_qty
    trust: probed
    note: "Required quantity of such PN"
  - column: part_request_2.percentage
    name_status: unnamed
    trust: probed
    note: "After each use, the qty will subtract that percentage"
  - column: part_request_2.externally_provisioned
    name_status: unnamed
    trust: probed
    note: "Y if the PN is coming from customers"
  - column: part_request_2.no_pcf
    name_status: approved
    name: part_no_pcf
    trust: probed
    note: "PN not included in the forecast (needs attention)"
  - column: part.tool
    name_status: proposed
    proposed_name: part_tool
    trust: probed
    encoding: bool_yn
    enum:
      source: csv
      values: { "Y": "Part is a tool", "N": "Part is not a tool" }
    meaning: "Tool classification of the part. Reached through part_request_2.partno -> part.partno."
    note: "Probed 2026-11-18 on the DWH: values are only Y or N (no blanks). PART: 17,799 tools of 192,627 parts (R 15,206 of 44,803; C 2,593 of 146,388; S 0 of 1,436). Among matched WSL part requests, 4,997,053 of 14,109,629 are tools (R 4,779,878 of 5,282,525 rows, i.e. 90%; C 217,175 of 8,825,785). Tools exist under both R and C, so mat_class alone cannot classify a tool. Other tool-like columns (part_forecast.tool, history.tool, pickslip_header.is_tool_ps) are copies or per-transaction flags and are not used here; pickslip_header.is_tool_ps is blank on 415,195 of 434,621 pickslips."
